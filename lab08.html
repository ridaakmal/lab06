<DOCTYPE.html>
<html>
<head>
<style>
body 
{
background-color: lightgray;
font-family: Arial;
}
h3 
{
text-align: center;
color: red;
}
.form-box 
{
width: 580px;
margin: auto;
background-color: lightblue;
border: 2px solid gray;
padding: 5px;
}
table 
{
width: 100%;
border-collapse: collapse;
}
td 
{
border: 1px solid gray;
padding: 4px;
background-color: lightblue;
}
.label 
{
width: 140px;
text-align: right;
font-weight: bold;
}
input[type="text"] 
{
width: 135px;
height: 18px;
}
.wide 
{
width: 190px 
}
.button 
{
text-align: center;
}
</style>
</head>
<body>
<h3>Continental Hotel Reservation Form</h3>
<div class="form-box">
<table>
<tr>
<td class="label">Name</td>
<td>
<input type="text" placeholder="Enter your name">
</td>
</tr>
<tr>
<td class="label">eMail</td>
<td>
<input type="text" value="info@continental.pk">
</td>
</tr>
<tr>
<td class="label">Mobile No</td>
<td>
<input type="text" placeholder="Enter your cell number">
</td>
</tr>
<tr>
<td class="label">Arrival Time</td>
<td>
<input type="text" placeholder="Enter your arrival time">
</td>
</tr>
<tr>
<td class="label">Departure</td>
<td>
<input type="date">
<input type="time">
</td>
</tr>
<tr>
<td class="label">Room Type</td>
<td>
<input type="radio" name="room">Single
<input type="radio" name="room">Double
<br>
<input type="radio" name="room">Presidential Suite
</td>
</tr>
<tr>
<td class="label">Preferences</td>
<td>
<input type="checkbox">Non-Smoking
<br>
<input type="checkbox">Internet
<br>
<input type="checkbox">Firm Mattress
</td>
</tr>
<tr>
<td class="label">Mode of Payment</td>
<td>
<input type="radio" name="payment">Cash
<input type="radio" name="payment">Check
<br>
<input type="radio" name="payment">Credit Card
<select>
<option>Select Card</option>
<option>Visa</option>
<option>MasterCard</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" class="button">
<input type="submit" value="Send Data">
</td>
</tr>
</table>
</div>
</body>
</html>
